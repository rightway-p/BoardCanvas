name: Signed Windows release

on:
  push:
    branches:
      - dev
      - main
    paths:
      - package.json
      - src-tauri/Cargo.toml
      - src-tauri/tauri.conf.json
  workflow_dispatch:
    inputs:
      channel:
        description: Must match the selected deployment branch (dev=beta, main=stable)
        required: true
        type: choice
        options:
          - beta
          - stable
      validation_record:
        description: Checked-in docs/release-validation/<version>.md record (required for stable)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    outputs:
      channel: ${{ steps.context.outputs.channel }}
      version: ${{ steps.context.outputs.version }}
      source_sha: ${{ steps.context.outputs.source_sha }}
      skip_release: ${{ steps.context.outputs.skip_release }}
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate branch, release version, immutable tag, and stable evidence
        id: context
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VALIDATION_RECORD: ${{ inputs.validation_record }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REF_NAME -notin @('dev', 'main')) { throw 'Signed releases are allowed only from dev or main.' }
          $expectedChannel = if ($env:REF_NAME -eq 'dev') { 'beta' } else { 'stable' }
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_CHANNEL -cne $expectedChannel) { throw 'The requested channel does not match the deployment branch.' }
          $channel = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_CHANNEL } else { $expectedChannel }

          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $cargo = Get-Content -Raw src-tauri/Cargo.toml
          $tauri = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $version = [string]$package.version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$' -or $cargoVersion -cne $version -or $tauri.package.version -cne $version) { throw 'package.json, Cargo.toml, and tauri.conf.json must contain the same valid release version.' }
          if ($channel -eq 'beta' -and $version -notmatch '-beta\.') { throw 'dev beta releases require a -beta.<n> prerelease version.' }
          if ($channel -eq 'stable' -and $version.Contains('-')) { throw 'main stable releases require a non-prerelease version.' }
          if ((git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA) { throw 'Checkout does not match the triggering commit.' }

          # BEGIN existing immutable release verification
          $tag = "v$version"
          $tagLines = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the remote version tag.' }
          if ($tagLines.Count -gt 0) {
            $tagSha = (($tagLines | Where-Object { $_ -notmatch '\^\{\}$' } | Select-Object -First 1) -split '\s+')[0]
            if (-not $tagSha) { throw 'Could not resolve the existing immutable version tag.' }
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the existing version tag.' }
            if ((git rev-parse "$tag^{commit}").Trim() -cne $env:SOURCE_SHA) { throw 'The immutable version tag points to a different source commit.' }
          }

          # Existing releases are immutable. Verify their assets and channel feed before treating a rerun as complete.
          $releaseLookup = @(& gh api "repos/$env:REPOSITORY/releases/tags/$tag" 2>&1)
          $releaseLookupExitCode = $LASTEXITCODE
          if ($releaseLookupExitCode -ne 0 -and ($releaseLookup -join "`n") -notmatch '(?i)HTTP 404|release not found') { throw 'Could not determine whether this version has already been released.' }
          if ($releaseLookupExitCode -eq 0) {
            if ($tagLines.Count -eq 0) { throw "Existing release $tag has no immutable source tag; publication is incomplete and manual recovery is required." }
            try { $versionedRelease = ($releaseLookup -join "`n") | ConvertFrom-Json } catch { throw "Could not read the existing release $tag; immutable release left untouched and manual recovery is required." }
            $expectedAssets = @("BoardCanvas_${version}_x64-setup.exe", "BoardCanvas_${version}_x64-setup.exe.sig", 'board-release.json', 'board-release.json.sig')
            $versionedAssets = @($versionedRelease.assets | ForEach-Object { $_.name })
            $missingAssets = @($expectedAssets | Where-Object { $_ -notin $versionedAssets })
            $expectedPrerelease = $channel -eq 'beta'
            if ($versionedRelease.draft -ne $false -or $versionedRelease.prerelease -ne $expectedPrerelease -or $missingAssets.Count -gt 0) { throw "Existing version publication $tag is incomplete (draft, wrong channel, or missing signed assets: $($missingAssets -join ', ')); immutable release and tag left untouched. Verify the versioned installer, metadata signature, and installer hash against the trusted updater key, then recover the release/feed manually; do not retag or replace the installer." }

            $branchName = if ($channel -eq 'beta') { 'dev' } else { 'main' }
            $branch = @(git ls-remote origin "refs/heads/$branchName")
            if ($LASTEXITCODE -ne 0 -or -not $branch) { throw "Could not verify the current $branchName branch before completing this rerun." }
            $latestBranchSha = ($branch[0] -split '\s+')[0]
            if ($latestBranchSha -cne $env:SOURCE_SHA) {
              Write-Host "Version $version is complete but superseded on $branchName; preserving the current rolling feed/latest pointer."
              "channel=$channel" >> $env:GITHUB_OUTPUT
              "version=$version" >> $env:GITHUB_OUTPUT
              "source_sha=$env:SOURCE_SHA" >> $env:GITHUB_OUTPUT
              'skip_release=true' >> $env:GITHUB_OUTPUT
              exit 0
            }

            if ($channel -eq 'beta') {
              $feedLookup = @(& gh api "repos/$env:REPOSITORY/releases/tags/board-beta" 2>&1)
              if ($LASTEXITCODE -ne 0) { throw 'Existing beta version release is complete, but the rolling beta feed could not be inspected. Immutable release left untouched; manual recovery is required.' }
              try { $betaFeed = ($feedLookup -join "`n") | ConvertFrom-Json } catch { throw 'Could not read the existing rolling beta feed; immutable version release left untouched and manual recovery is required.' }
              $feedAssets = @($betaFeed.assets | ForEach-Object { $_.name })
              if ($betaFeed.draft -ne $false -or $betaFeed.prerelease -ne $true -or 'board-release.json' -notin $feedAssets -or 'board-release.json.sig' -notin $feedAssets) { throw 'Existing beta version release is complete, but the rolling beta feed is draft or incomplete; immutable version release left untouched. Verify versioned signatures and installer hash against the trusted updater key, then manually copy the exact versioned board-release.json and .sig to board-beta. Do not retag or replace the installer.' }
              $versionedDirectory = Join-Path $env:RUNNER_TEMP "existing-version-metadata-$version"
              if (Test-Path -LiteralPath $versionedDirectory) { throw 'Temporary version metadata inspection directory already exists; refusing to reuse possibly stale files.' }
              New-Item -ItemType Directory -Path $versionedDirectory | Out-Null
              gh release download $tag --repo $env:REPOSITORY --pattern board-release.json --pattern board-release.json.sig --dir $versionedDirectory
              if ($LASTEXITCODE -ne 0) { throw 'Could not download immutable version metadata and signature; release left untouched and manual recovery is required.' }
              $feedDirectory = Join-Path $env:RUNNER_TEMP "existing-beta-feed-$version"
              if (Test-Path -LiteralPath $feedDirectory) { throw 'Temporary beta feed inspection directory already exists; refusing to reuse possibly stale metadata.' }
              New-Item -ItemType Directory -Path $feedDirectory | Out-Null
              gh release download board-beta --repo $env:REPOSITORY --pattern board-release.json --pattern board-release.json.sig --dir $feedDirectory
              if ($LASTEXITCODE -ne 0) { throw 'Could not download the existing beta feed metadata; immutable version release left untouched and manual recovery is required.' }
              try { $feedManifest = Get-Content -Raw -LiteralPath (Join-Path $feedDirectory 'board-release.json') | ConvertFrom-Json } catch { throw 'Existing beta feed metadata is unreadable; immutable version release left untouched and manual recovery is required.' }
              try { $versionedManifest = Get-Content -Raw -LiteralPath (Join-Path $versionedDirectory 'board-release.json') | ConvertFrom-Json } catch { throw 'Immutable version metadata is unreadable; release left untouched and manual recovery is required.' }
              $versionedMetadataHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $versionedDirectory 'board-release.json')).Hash
              $versionedSignatureHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $versionedDirectory 'board-release.json.sig')).Hash
              $feedMetadataHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $feedDirectory 'board-release.json')).Hash
              $feedSignatureHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $feedDirectory 'board-release.json.sig')).Hash
              if ($versionedManifest.version -cne $version -or $versionedManifest.channel -cne 'beta' -or $feedManifest.version -cne $version -or $feedManifest.channel -cne 'beta' -or $versionedMetadataHash -cne $feedMetadataHash -or $versionedSignatureHash -cne $feedSignatureHash) { throw "Existing beta version release $version is complete, but board-beta metadata/signature does not exactly match its versioned signed pair. Verify the immutable versioned signature and installer hash against the trusted updater key, then manually copy the exact versioned board-release.json and .sig to board-beta. Do not retag or replace the installer." }
            } elseif ($channel -eq 'stable') {
              $latestLookup = @(& gh release view --repo $env:REPOSITORY --json tagName 2>&1)
              if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the latest stable release; existing immutable release left untouched and manual recovery is required.' }
              try { $latestRelease = ($latestLookup -join "`n") | ConvertFrom-Json } catch { throw 'Could not read the latest stable release; existing immutable release left untouched and manual recovery is required.' }
              if ($latestRelease.tagName -cne $tag) { throw "Existing stable version release $tag is complete but GitHub's latest release is $($latestRelease.tagName). Immutable release left untouched; verify release ordering and recover manually without moving the tag." }
            }

            Write-Host "Version $version is already completely published; this rerun is a no-op."
            "channel=$channel" >> $env:GITHUB_OUTPUT
            "version=$version" >> $env:GITHUB_OUTPUT
            "source_sha=$env:SOURCE_SHA" >> $env:GITHUB_OUTPUT
            'skip_release=true' >> $env:GITHUB_OUTPUT
            exit 0
          }
          # END existing immutable release verification

          if ($channel -eq 'stable') {
            $recordPath = "docs/release-validation/$version.md"
            if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_VALIDATION_RECORD -cne $recordPath) { throw 'Stable promotion requires the exact checked-in validation record path for this version.' }
            if (-not (Test-Path -LiteralPath $recordPath -PathType Leaf)) { throw 'The reviewed stable validation record is missing from the triggering commit.' }
            $record = Get-Content -Raw -LiteralPath $recordPath
            if ($record -notmatch '(?m)^status:\s*reviewed\s*$' -or $record -notmatch '(?m)^hardware_validation:\s*passed\s*$' -or $record -notmatch '(?m)^beta_validation:\s*passed\s*$' -or $record -notmatch '(?m)^reviewer:\s*\S+\s*$') { throw 'Stable validation requires reviewed status, passed beta and hardware validation, and a named reviewer.' }
          }

          "channel=$channel" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "source_sha=$env:SOURCE_SHA" >> $env:GITHUB_OUTPUT
          'skip_release=false' >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        if: steps.context.outputs.skip_release != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and run tests
        if: steps.context.outputs.skip_release != 'true'
        run: |
          npm ci
          npm test

      - name: Build web assets
        if: steps.context.outputs.skip_release != 'true'
        run: npm run web:build

  build-and-release:
    needs: validate
    if: needs.validate.outputs.skip_release != 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    environment:
      name: ${{ needs.validate.outputs.channel == 'stable' && 'stable-release' || 'beta-release' }}
    env:
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      BOARD_RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
      BOARD_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      VERSION: ${{ needs.validate.outputs.version }}
      CHANNEL: ${{ needs.validate.outputs.channel }}
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - name: Checkout the validated triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0

      - name: Confirm source and signing configuration
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA) { throw 'Build checkout does not match the validated triggering commit.' }
          if (-not $env:TAURI_PRIVATE_KEY -or -not $env:TAURI_KEY_PASSWORD -or -not $env:TAURI_UPDATER_PUBLIC_KEY) { throw 'All three Tauri updater secrets must be configured.' }
          $expected = (Get-Content -Raw -LiteralPath 'src-tauri/updater.pub').Trim()
          if ($expected -cne $env:TAURI_UPDATER_PUBLIC_KEY.Trim()) { throw 'Configured public key does not match src-tauri/updater.pub.' }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install web dependencies
        run: npm ci

      - name: Build the external recovery helper
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --bin boardcanvas-recovery --features recovery-helper-build --release
          if ($LASTEXITCODE -ne 0) { throw 'Recovery helper build failed.' }
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/boardcanvas-recovery.exe -Destination src-tauri/resources/boardcanvas-recovery.exe

      - name: Build and sign the current-user NSIS installer and release metadata
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'src-tauri/resources/boardcanvas-recovery.exe')) { throw 'Recovery helper is missing.' }
          npx --no-install tauri build
          if ($LASTEXITCODE -ne 0) { throw 'Tauri application build failed.' }
          $installer = "BoardCanvas_${env:VERSION}_x64-setup.exe"
          $bundle = Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter $installer -File | Select-Object -First 1
          if (-not $bundle) { throw 'The versioned current-user NSIS installer was not produced.' }
          $output = Join-Path $env:RUNNER_TEMP 'signed-release-assets'
          & scripts/package-signed-release.ps1 -Version $env:VERSION -Channel $env:CHANNEL -InstallerPath $bundle.FullName -OutputDirectory $output
          if ($LASTEXITCODE -ne 0) { throw 'Release signing failed.' }

      - name: Create the immutable version tag after successful validation and build
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          $remote = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the remote version tag.' }
          if ($remote.Count -eq 0) {
            git config --local user.name 'github-actions[bot]'
            git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $tag $env:SOURCE_SHA -m "BoardCanvas $env:VERSION"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the version tag.' }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) {
              git tag -d $tag *> $null
              throw 'Could not create the immutable version tag on origin.'
            }
          } else {
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            if ($LASTEXITCODE -ne 0 -or (git rev-parse "$tag^{commit}").Trim() -cne $env:SOURCE_SHA) { throw 'The existing immutable version tag does not match the built source commit.' }
          }

      - name: Publish versioned beta installer and rolling beta feed
        if: env.CHANNEL == 'beta'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $feed = gh release view board-beta --repo $env:REPOSITORY --json isPrerelease --jq '.isPrerelease'
          if ($LASTEXITCODE -ne 0 -or $feed.Trim() -ne 'true') { throw 'Create the board-beta GitHub prerelease before publishing beta feed metadata.' }
          $assets = @(
            "$env:RUNNER_TEMP/signed-release-assets/BoardCanvas_$($env:VERSION)_x64-setup.exe",
            "$env:RUNNER_TEMP/signed-release-assets/BoardCanvas_$($env:VERSION)_x64-setup.exe.sig",
            "$env:RUNNER_TEMP/signed-release-assets/board-release.json",
            "$env:RUNNER_TEMP/signed-release-assets/board-release.json.sig"
          )
          gh release create "v$env:VERSION" @assets --repo $env:REPOSITORY --verify-tag --prerelease --title "BoardCanvas $env:VERSION (Beta)" --notes "Signed beta installer. Source: immutable v$env:VERSION tag."
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the immutable versioned beta release.' }
          $branch = @(git ls-remote origin refs/heads/dev)
          if ($LASTEXITCODE -ne 0 -or -not $branch) { throw 'Could not verify the current dev branch before updating the beta feed.' }
          $latestDevSha = ($branch[0] -split '\s+')[0]
          if ($latestDevSha -cne $env:SOURCE_SHA) {
            Write-Host "Skipping rolling beta feed update because $env:VERSION is superseded by a newer dev commit."
            exit 0
          }
          gh release upload board-beta "$env:RUNNER_TEMP/signed-release-assets/board-release.json" "$env:RUNNER_TEMP/signed-release-assets/board-release.json.sig" --repo $env:REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the rolling beta feed metadata.' }

      - name: Publish stable release after evidence review
        if: env.CHANNEL == 'stable'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VALIDATION_RECORD: docs/release-validation/${{ needs.validate.outputs.version }}.md
        run: |
          $assets = @(
            "$env:RUNNER_TEMP/signed-release-assets/BoardCanvas_$($env:VERSION)_x64-setup.exe",
            "$env:RUNNER_TEMP/signed-release-assets/BoardCanvas_$($env:VERSION)_x64-setup.exe.sig",
            "$env:RUNNER_TEMP/signed-release-assets/board-release.json",
            "$env:RUNNER_TEMP/signed-release-assets/board-release.json.sig"
          )
          $notes = "Stable signed installer. Reviewed validation record: $env:VALIDATION_RECORD. Protected environment approval is required."
          $branch = @(git ls-remote origin refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or -not $branch) { throw 'Could not verify the current main branch before publishing stable.' }
          $latestArgs = @('--latest=true')
          if (($branch[0] -split '\s+')[0] -cne $env:SOURCE_SHA) {
            Write-Host "The validated stable source has been superseded on main; publishing $env:VERSION without changing GitHub's latest release pointer."
            $latestArgs = @('--latest=false')
          }
          gh release create "v$env:VERSION" @assets @latestArgs --repo $env:REPOSITORY --verify-tag --title "BoardCanvas $env:VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the stable release.' }
